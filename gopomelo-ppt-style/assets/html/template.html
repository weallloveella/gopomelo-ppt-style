<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoPomelo PPT Style</title>
  <style>
    :root {
      --pink:#ed2e7b;
      --pink-bright:#f83f8f;
      --pink-deep:#c91866;
      --coral:#f45138;
      --orange:#ff6a00;
      --gold:#ffb900;
      --ink-deep:#141414;
      --ink:#141414;
      --ink-soft:#2a2a2a;
      --muted:#626262;
      --paper:#fff;
      --paper-2:#f4f4f4;
      --paper-3:#ebebeb;
      --white:#fff;
      --line:rgba(20,20,20,.10);
      --shadow:0 24px 72px rgba(20,20,20,.10);
      --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
      --font-text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    }

    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body {
      background:var(--ink);
      color:var(--ink);
      font-family:var(--font-text);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    img { display:block; max-width:100%; }
    button { font:inherit; }

    #deck {
      width:100vw;
      height:100vh;
      display:flex;
      transition:transform .72s cubic-bezier(.22,.74,.22,1);
      will-change:transform;
    }
    body.low-power #deck { transition:none; }

    .slide {
      position:relative;
      isolation:isolate;
      width:100vw;
      height:100vh;
      flex:0 0 100vw;
      overflow:hidden;
      padding:7.5vh 5.625vw 8.5vh;
    }
    .slide::before,
    .slide::after {
      content:"";
      position:absolute;
      z-index:-1;
      pointer-events:none;
    }
    .slide[data-state="warm"] {
      --muted:rgba(255,255,255,.88);
      color:var(--white);
      background:
        radial-gradient(70% 110% at 84% 22%,rgba(255,185,0,.98) 0%,rgba(255,185,0,0) 55%),
        radial-gradient(66% 96% at 48% 88%,rgba(237,46,123,.98) 0%,rgba(237,46,123,0) 68%),
        linear-gradient(118deg,var(--orange) 0%,var(--coral) 48%,var(--pink) 100%);
    }
    .slide[data-layout="GP06"][data-state="warm"] {
      background:
        radial-gradient(64% 100% at 14% 86%,rgba(237,46,123,.96) 0%,rgba(237,46,123,0) 62%),
        radial-gradient(70% 100% at 88% 16%,rgba(255,185,0,.98) 0%,rgba(255,185,0,0) 55%),
        linear-gradient(125deg,var(--pink) 0%,var(--coral) 43%,var(--orange) 100%);
    }
    .slide[data-state="warm"]::before {
      width:92vw;
      height:14vw;
      right:-24vw;
      top:31vh;
      border:0;
      border-radius:999px;
      background:linear-gradient(90deg,transparent,rgba(255,185,0,.64),rgba(255,255,255,.12),transparent);
      filter:blur(18px);
      transform:rotate(-38deg);
      opacity:.62;
    }
    .slide[data-state="warm"]::after {
      inset:0;
      background:radial-gradient(circle at 52% 96%,rgba(237,46,123,.26),transparent 32%);
    }
    .slide[data-state="light"] {
      color:var(--ink);
      background:
        radial-gradient(circle at 96% 2%,rgba(237,46,123,.09),transparent 20%),
        var(--white);
    }
    .slide[data-state="light"]::after {
      right:-7vw;
      top:-11vw;
      width:25vw;
      height:25vw;
      border-radius:50%;
      border:1px solid rgba(248,63,143,.10);
    }
    .slide[data-state="dark"] {
      color:var(--white);
      background:
        radial-gradient(circle at 92% 6%,rgba(237,46,123,.18),transparent 25%),
        var(--ink);
    }

    .safe { position:relative; width:100%; height:100%; }
    .chrome {
      position:absolute;
      left:5.625vw;
      right:5.625vw;
      bottom:2.6vh;
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-size:clamp(11px,.82vw,14px);
      font-weight:600;
      letter-spacing:.08em;
      text-transform:uppercase;
      opacity:.62;
      pointer-events:none;
    }
    .chrome .brand-mini { letter-spacing:-.01em; text-transform:none; }

    .logo-pill {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:0;
      padding:0;
      border-radius:0;
      background:transparent;
      box-shadow:none;
    }
    .logo-pill img { width:142px; height:auto; }
    .logo-plain { width:142px; height:auto; }
    .logo-top-right {
      position:absolute;
      z-index:3;
      top:0;
      right:0;
    }
    [data-state="warm"] .logo-pill img,
    [data-state="warm"] .logo-plain { filter:brightness(0) invert(1); }

    .eyebrow {
      display:inline-flex;
      align-items:center;
      gap:10px;
      margin:0 0 18px;
      font-size:clamp(12px,.9vw,15px);
      font-weight:700;
      letter-spacing:.11em;
      text-transform:uppercase;
    }
    .eyebrow::before {
      content:"";
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--pink);
      box-shadow:0 0 0 6px rgba(248,63,143,.10);
    }
    [data-state="warm"] .eyebrow::before {
      background:var(--white);
      box-shadow:0 0 0 6px rgba(255,255,255,.14);
    }

    h1,h2,h3,p { margin:0; }
    .display {
      max-width:1050px;
      font-family:var(--font-display);
      font-size:clamp(64px,7.1vw,102px);
      font-weight:700;
      line-height:.94;
      letter-spacing:-.045em;
    }
    .section-title {
      max-width:960px;
      font-family:var(--font-display);
      font-size:clamp(44px,4.25vw,64px);
      font-weight:680;
      line-height:.98;
      letter-spacing:-.042em;
    }
    .statement {
      max-width:1080px;
      font-family:var(--font-display);
      font-size:clamp(58px,6.2vw,90px);
      font-weight:700;
      line-height:.98;
      letter-spacing:-.045em;
    }
    .lead {
      max-width:760px;
      margin-top:24px;
      font-size:clamp(19px,1.55vw,24px);
      line-height:1.42;
      letter-spacing:-.015em;
      color:var(--muted);
    }
    [data-state="warm"] .lead { color:rgba(255,255,255,.90); }
    [data-state="dark"] .lead { color:rgba(255,255,255,.78); }
    .body-copy { font-size:clamp(17px,1.32vw,21px); line-height:1.48; color:var(--muted); }
    [data-state="warm"] .body-copy { color:rgba(255,255,255,.86); }
    [data-state="dark"] .body-copy { color:rgba(255,255,255,.72); }
    [data-state="warm"] .on-light {
      --muted:#626262;
      color:var(--ink);
    }

    .title-row { display:flex; align-items:flex-start; justify-content:space-between; gap:32px; }
    .title-row .logo-plain { margin-top:4px; }

    .cover-grid { height:100%; display:grid; grid-template-rows:auto 1fr auto; }
    .cover-top { display:flex; align-items:center; justify-content:space-between; }
    .cover-copy { align-self:center; max-width:1040px; }
    .cover-copy .display { max-width:980px; }
    .cover-meta { display:flex; align-items:flex-end; justify-content:space-between; gap:28px; }
    .cover-meta p { max-width:700px; font-size:clamp(18px,1.42vw,22px); line-height:1.42; color:var(--muted); }
    [data-state="dark"] .cover-meta p { color:rgba(255,255,255,.8); }
    [data-state="warm"] .cover-meta p { color:rgba(255,255,255,.88); }
    .tag-row { display:flex; flex-wrap:wrap; gap:9px; margin-top:28px; }
    .tag {
      padding:8px 13px;
      border:1px solid rgba(255,255,255,.3);
      border-radius:999px;
      background:rgba(255,255,255,.13);
      font-size:clamp(12px,.84vw,14px);
      font-weight:650;
      backdrop-filter:blur(12px);
    }

    .index-grid { height:100%; display:grid; grid-template-columns:.9fr 1.1fr; gap:6vw; align-items:center; }
    .index-list { display:grid; gap:12px; }
    .index-item {
      display:grid;
      grid-template-columns:56px 1fr;
      gap:18px;
      align-items:start;
      padding:18px 20px;
      border:1px solid var(--line);
      border-radius:22px;
      background:rgba(255,255,255,.78);
      box-shadow:0 14px 38px rgba(20,20,20,.05);
    }
    .index-item b { color:var(--pink-deep); font-size:18px; }
    .index-item h3 { font-size:clamp(20px,1.55vw,25px); letter-spacing:-.025em; }
    .index-item p { margin-top:5px; color:var(--muted); font-size:clamp(15px,1.08vw,18px); line-height:1.38; }

    .statement-wrap { height:100%; display:flex; flex-direction:column; justify-content:center; }
    .statement-wrap .lead { max-width:720px; }

    .cards-layout { height:100%; display:grid; grid-template-rows:auto 1fr; gap:5vh; }
    .card-grid { display:grid; gap:20px; align-items:stretch; }
    .card-grid.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .card {
      position:relative;
      overflow:hidden;
      padding:28px;
      border:1px solid var(--line);
      border-radius:30px;
      background:rgba(244,244,244,.94);
      box-shadow:none;
    }
    [data-state="dark"] .card {
      border-color:rgba(255,255,255,.12);
      background:rgba(255,255,255,.075);
      box-shadow:none;
    }
    .card::after {
      content:"";
      position:absolute;
      right:-70px;
      bottom:-86px;
      width:180px;
      height:180px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(237,46,123,.16),rgba(255,106,0,.08) 42%,transparent 70%);
    }
    .icon-chip {
      width:48px;
      height:48px;
      display:grid;
      place-items:center;
      margin-bottom:28px;
      border-radius:16px;
      background:rgba(237,46,123,.10);
      color:var(--pink-deep);
      font-size:16px;
      font-weight:800;
    }
    [data-state="dark"] .icon-chip { color:var(--pink); background:rgba(255,255,255,.09); }
    .gradient-card {
      color:var(--white);
      border-color:transparent;
      background:
        radial-gradient(70% 80% at 54% 45%,var(--gold) 0%,rgba(255,185,0,0) 58%),
        linear-gradient(135deg,var(--pink) 0%,var(--coral) 52%,var(--orange) 100%);
      box-shadow:0 22px 60px rgba(237,46,123,.18);
    }
    .card.gradient-card h3 { color:var(--white); }
    .card.gradient-card p { color:rgba(255,255,255,.88); }
    .gradient-card .icon-chip { position:relative; z-index:1; color:var(--pink); background:rgba(255,255,255,.92); }
    .card h3 { position:relative; z-index:1; font-size:clamp(23px,1.8vw,29px); letter-spacing:-.035em; }
    .card p { position:relative; z-index:1; margin-top:14px; font-size:clamp(16px,1.18vw,19px); line-height:1.45; color:var(--muted); }
    [data-state="dark"] .card p { color:rgba(255,255,255,.7); }

    .split-grid { height:100%; display:grid; grid-template-columns:.88fr 1.12fr; gap:5vw; align-items:center; }
    .split-copy { max-width:530px; }
    .split-copy .lead { font-size:clamp(17px,1.3vw,21px); }
    .media-frame {
      position:relative;
      overflow:hidden;
      height:min(62vh,500px);
      border-radius:34px;
      border:1px solid rgba(255,255,255,.6);
      background:var(--ink);
      box-shadow:var(--shadow);
    }
    .media-frame img { width:100%; height:100%; object-fit:cover; }
    .media-frame.contain img { object-fit:contain; background:#fff; }
    .glass-label {
      position:absolute;
      left:18px;
      bottom:18px;
      max-width:72%;
      padding:11px 14px;
      border:1px solid rgba(255,255,255,.55);
      border-radius:16px;
      background:rgba(255,255,255,.78);
      color:var(--ink);
      font-size:clamp(13px,.96vw,16px);
      font-weight:650;
      backdrop-filter:blur(18px);
    }

    .divider-wrap { height:100%; display:grid; grid-template-columns:auto 1fr; gap:4vw; align-items:center; }
    .act-no { font-size:clamp(110px,14vw,205px); font-weight:800; line-height:.8; letter-spacing:-.08em; opacity:.26; }
    .divider-copy { max-width:850px; }

    .workflow-layout { height:100%; display:grid; grid-template-rows:auto 1fr; gap:6vh; }
    .workflow { position:relative; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; align-items:start; }
    .workflow::before {
      content:"";
      position:absolute;
      left:8%;
      right:8%;
      top:35px;
      height:2px;
      background:linear-gradient(90deg,var(--pink) 0%,var(--pink) 58%,var(--coral) 82%,var(--orange) 100%);
      opacity:.78;
    }
    .workflow-step { position:relative; z-index:1; padding:0 8px; }
    .workflow-step b {
      width:70px;
      height:70px;
      display:grid;
      place-items:center;
      border-radius:22px;
      background:rgba(255,255,255,.94);
      color:var(--pink-deep);
      font-size:20px;
      box-shadow:0 16px 38px rgba(0,0,0,.12);
    }
    .workflow-step h3 { margin-top:22px; font-size:clamp(20px,1.52vw,25px); letter-spacing:-.03em; }
    .workflow-step p { margin-top:9px; color:rgba(255,255,255,.68); font-size:clamp(15px,1.04vw,18px); line-height:1.42; }

    .data-grid { height:100%; display:grid; grid-template-columns:1.05fr .95fr; gap:5vw; align-items:center; }
    .hero-metric { font-size:clamp(118px,15vw,220px); font-weight:750; line-height:.78; letter-spacing:-.085em; color:var(--pink); }
    .metric-note { max-width:660px; margin-top:30px; font-size:clamp(19px,1.45vw,23px); line-height:1.42; color:var(--muted); }
    .metric-grid { display:grid; gap:14px; }
    .metric {
      padding:22px 24px;
      border:1px solid var(--line);
      border-radius:24px;
      background:rgba(255,255,255,.78);
      box-shadow:0 16px 40px rgba(20,20,20,.05);
    }
    .metric strong { display:block; color:var(--pink-deep); font-size:clamp(28px,2.2vw,36px); letter-spacing:-.045em; }
    .metric span { display:block; margin-top:5px; color:var(--muted); font-size:clamp(15px,1.02vw,17px); }

    .case-grid { height:100%; display:grid; grid-template-columns:1.06fr .94fr; gap:4vw; align-items:center; }
    .case-media { height:min(61vh,480px); }
    .case-evidence { display:grid; gap:6px; }
    .case-evidence .section-title { font-size:clamp(38px,3.55vw,52px); }
    .case-evidence .eyebrow { margin-bottom:10px; }
    .evidence-row { padding:11px 16px; border-top:1px solid rgba(255,255,255,.16); }
    .evidence-row:first-child { border-top:0; }
    .evidence-row span { color:var(--pink); font-size:13px; font-weight:750; letter-spacing:.11em; text-transform:uppercase; }
    .evidence-row h3 { margin-top:5px; font-size:clamp(19px,1.4vw,23px); letter-spacing:-.028em; }
    .evidence-row p { margin-top:4px; color:rgba(255,255,255,.68); font-size:clamp(14px,.98vw,17px); line-height:1.32; }

    .closing-grid { height:100%; display:grid; grid-template-rows:auto 1fr auto; }
    .closing-mark {
      position:absolute;
      z-index:0;
      right:1.5vw;
      top:17vh;
      width:min(31vw,400px);
      aspect-ratio:1;
      overflow:visible;
      transform:rotate(-7deg);
      filter:drop-shadow(0 28px 42px rgba(237,46,123,.16));
      pointer-events:none;
    }
    .closing-grid > :not(.closing-mark) { position:relative; z-index:1; }
    .closing-copy { align-self:center; max-width:760px; }
    .cta-row { display:flex; align-items:center; gap:14px; margin-top:30px; }
    .cta {
      display:inline-flex;
      min-height:48px;
      align-items:center;
      justify-content:center;
      padding:0 22px;
      border-radius:999px;
      background:var(--ink);
      color:var(--white);
      font-size:16px;
      font-weight:700;
    }
    .cta.secondary { background:transparent; color:var(--ink); border:1px solid var(--line); }
    [data-state="dark"] .cta,
    [data-state="warm"] .cta { background:rgba(255,255,255,.94); color:var(--ink); }
    [data-state="dark"] .cta.secondary,
    [data-state="warm"] .cta.secondary { background:rgba(255,255,255,.08); color:var(--white); border-color:rgba(255,255,255,.22); }

    .compare-grid { height:100%; display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:stretch; }
    .compare-panel { padding:32px; border-radius:32px; border:1px solid var(--line); background:rgba(255,255,255,.78); }
    .compare-panel.accent { background:radial-gradient(circle at 72% 30%,rgba(255,185,0,.28),transparent 34%),linear-gradient(145deg,rgba(237,46,123,.12),rgba(255,106,0,.05)),#fff; }
    .compare-panel h3 { font-size:clamp(30px,2.5vw,40px); letter-spacing:-.04em; }
    .compare-panel ul { margin:28px 0 0; padding:0; list-style:none; display:grid; gap:14px; }
    .compare-panel li { padding-top:14px; border-top:1px solid var(--line); font-size:clamp(16px,1.18vw,19px); line-height:1.4; }

    .mosaic { height:100%; display:grid; grid-template-columns:1.35fr .65fr .9fr; grid-template-rows:1fr 1fr; gap:14px; }
    .mosaic figure { position:relative; margin:0; overflow:hidden; border-radius:26px; background:var(--ink); }
    .mosaic figure:first-child { grid-row:1 / span 2; }
    .mosaic img { width:100%; height:100%; object-fit:cover; }
    .mosaic figcaption { position:absolute; left:12px; bottom:12px; padding:8px 11px; border-radius:999px; background:rgba(255,255,255,.82); color:var(--ink); font-size:13px; font-weight:650; backdrop-filter:blur(12px); }

    #nav {
      position:fixed;
      z-index:30;
      left:50%;
      bottom:2.4vh;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      gap:8px;
    }
    #nav button {
      width:7px;
      height:7px;
      padding:0;
      border:0;
      border-radius:50%;
      background:rgba(255,255,255,.35);
      cursor:pointer;
      transition:width .25s ease,background .25s ease;
    }
    body.light-current #nav button { background:rgba(32,37,45,.25); }
    #nav button.active { width:24px; border-radius:999px; background:rgba(255,255,255,.9); }
    body.light-current #nav button.active { background:var(--pink); }
    #hint {
      position:fixed;
      z-index:30;
      right:10vw;
      bottom:2.1vh;
      color:rgba(255,255,255,.62);
      font-size:11px;
      font-weight:650;
      letter-spacing:.08em;
      text-transform:uppercase;
      pointer-events:none;
    }
    body.light-current #hint { color:rgba(32,37,45,.5); }

    #overview {
      position:fixed;
      inset:0;
      z-index:100;
      display:none;
      overflow:auto;
      padding:4vh 4vw;
      background:rgba(32,37,45,.95);
      backdrop-filter:blur(16px);
    }
    #overview.open { display:block; }
    .overview-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px; }
    .overview-card { overflow:hidden; padding:0; border:1px solid rgba(255,255,255,.16); border-radius:20px; background:#fff; cursor:pointer; }
    .overview-card.current { border-color:var(--pink); box-shadow:0 0 0 2px rgba(248,63,143,.18); }
    .overview-visual { position:relative; aspect-ratio:16/9; overflow:hidden; background:var(--paper); }
    .overview-visual .slide { position:absolute; left:0; top:0; transform-origin:top left; }
    .overview-label { display:flex; justify-content:space-between; gap:14px; padding:10px 12px; color:var(--ink); font-size:12px; font-weight:700; }
    .overview-label span:last-child { color:var(--muted); }

    @media (max-width:900px) {
      .slide { padding-left:5vw; padding-right:5vw; }
      .overview-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .display { font-size:clamp(54px,8vw,82px); }
      .section-title { font-size:clamp(38px,5.4vw,54px); }
    }
    @media (prefers-reduced-motion:reduce) {
      #deck, #nav button { transition:none!important; }
    }
  </style>
</head>
<body>
  <main id="deck" aria-live="polite">
    <!-- SLIDES_HERE -->
  </main>
  <nav id="nav" aria-label="Slide navigation"></nav>
  <div id="hint">← → · Esc overview · B static</div>
  <div id="overview" aria-hidden="true"><div class="overview-grid"></div></div>

  <script type="module">
    const deck = document.getElementById('deck');
    const slides = [...deck.querySelectorAll('.slide')];
    const nav = document.getElementById('nav');
    const overview = document.getElementById('overview');
    const overviewGrid = overview.querySelector('.overview-grid');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let index = 0;
    let overviewOpen = false;
    let lowPower = reduced || localStorage.getItem('gopomelo-deck-static') === '1';
    let wheelLock = false;

    document.body.classList.toggle('low-power', lowPower);

    slides.forEach((slide, i) => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.setAttribute('aria-label', `Go to slide ${i + 1}`);
      dot.addEventListener('click', () => go(i));
      nav.append(dot);
    });

    function play(slide) {
      if (lowPower) return;
      const nodes = [...slide.querySelectorAll('[data-anim]')];
      nodes.forEach((node, i) => {
        const kind = node.dataset.anim;
        const from = kind === 'scale'
          ? { opacity:0, transform:'scale(.94)' }
          : kind === 'left'
            ? { opacity:0, transform:'translateX(-26px)' }
            : { opacity:0, transform:'translateY(24px)' };
        node.animate([from,{opacity:1,transform:'none'}],{
          duration:680,
          delay:Math.min(i * 85, 520),
          easing:'cubic-bezier(.2,.75,.2,1)',
          fill:'both'
        });
      });
    }

    function go(next, animate = true) {
      index = Math.max(0, Math.min(slides.length - 1, next));
      deck.style.transform = `translateX(${-index * 100}vw)`;
      slides.forEach((slide, i) => slide.classList.toggle('active', i === index));
      [...nav.children].forEach((dot, i) => dot.classList.toggle('active', i === index));
      document.body.classList.toggle('light-current', slides[index]?.dataset.state === 'light');
      if (animate) play(slides[index]);
    }

    function buildOverview() {
      overviewGrid.replaceChildren();
      slides.forEach((slide, i) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = `overview-card${i === index ? ' current' : ''}`;
        const visual = document.createElement('div');
        visual.className = 'overview-visual';
        const clone = slide.cloneNode(true);
        clone.classList.add('active');
        visual.append(clone);
        const label = document.createElement('div');
        label.className = 'overview-label';
        const title = clone.querySelector('h1,h2,.statement')?.textContent?.trim() || `Slide ${i + 1}`;
        label.innerHTML = `<span>${String(i + 1).padStart(2,'0')} · ${title.slice(0,44)}</span><span>${slide.dataset.layout}</span>`;
        card.append(visual,label);
        card.addEventListener('click', () => { toggleOverview(false); go(i); });
        overviewGrid.append(card);
        requestAnimationFrame(() => {
          const scale = Math.min(visual.clientWidth / innerWidth, visual.clientHeight / innerHeight);
          clone.style.width = `${innerWidth}px`;
          clone.style.height = `${innerHeight}px`;
          clone.style.transform = `scale(${scale})`;
        });
      });
    }

    function toggleOverview(force) {
      overviewOpen = typeof force === 'boolean' ? force : !overviewOpen;
      if (overviewOpen) buildOverview();
      overview.classList.toggle('open', overviewOpen);
      overview.setAttribute('aria-hidden', String(!overviewOpen));
    }

    addEventListener('keydown', event => {
      if (event.key.toLowerCase() === 'b') {
        lowPower = !lowPower;
        document.body.classList.toggle('low-power', lowPower);
        localStorage.setItem('gopomelo-deck-static', lowPower ? '1' : '0');
        return;
      }
      if (event.key === 'Escape') { toggleOverview(); return; }
      if (overviewOpen) return;
      if (['ArrowRight','ArrowDown','PageDown',' '].includes(event.key)) { event.preventDefault(); go(index + 1); }
      if (['ArrowLeft','ArrowUp','PageUp'].includes(event.key)) { event.preventDefault(); go(index - 1); }
      if (event.key === 'Home') go(0);
      if (event.key === 'End') go(slides.length - 1);
    });

    addEventListener('wheel', event => {
      if (overviewOpen || wheelLock) return;
      const delta = event.deltaY + event.deltaX;
      if (Math.abs(delta) < 55) return;
      wheelLock = true;
      go(index + (delta > 0 ? 1 : -1));
      setTimeout(() => { wheelLock = false; }, 520);
    }, { passive:true });

    let touchX = 0;
    let touchY = 0;
    addEventListener('touchstart', event => {
      touchX = event.touches[0].clientX;
      touchY = event.touches[0].clientY;
    }, { passive:true });
    addEventListener('touchend', event => {
      if (overviewOpen) return;
      const dx = event.changedTouches[0].clientX - touchX;
      const dy = event.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)) go(index + (dx < 0 ? 1 : -1));
    }, { passive:true });

    addEventListener('resize', () => { if (overviewOpen) buildOverview(); });
    go(0, !lowPower);
  </script>
</body>
</html>
